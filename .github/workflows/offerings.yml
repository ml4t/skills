# Keep the README's courses, workshops, and free lessons current.
#
# Dates in a README go stale silently. In the book repository a lesson callout
# sat at the top of the file for four weeks after the lesson had run and readers
# kept signing up for it. So the offerings block is generated, not written: this
# job reads the public Maven profile every morning, drops what is past, and
# proposes the result.
#
# It opens a pull request rather than pushing to main. The block is built from a
# page this repository does not control, so a person sees the rendered diff
# before it reaches a public README. update_offerings.py escapes and rejects the
# scraped fields as well; the review is the second line, not the only one.

name: README Offerings

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-offerings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Render the offerings block
        run: python .github/scripts/update_offerings.py

      - name: Validate the rewritten README
        # A pull request opened with GITHUB_TOKEN does not start another workflow
        # run, so the repository's own checks cannot gate this branch. Run the
        # README half of them here instead.
        run: python scripts/validate_skills.py

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README offerings are current; nothing to do."
            exit 0
          fi

          branch=readme-offerings
          git config user.name  "ml4t-offerings[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add README.md
          git commit -m "Refresh the README offerings block from the Maven schedule"

          # The branch holds nothing but today's render, so replacing it wholesale
          # is the intended behaviour; there is never a human commit to lose.
          git push --force origin "HEAD:$branch"

          open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "Updated existing pull request #$open_pr."
          else
            gh pr create --base main --head "$branch" \
              --title "Refresh the README offerings block" \
              --body "$(cat <<'BODY'
          Generated by `.github/workflows/offerings.yml` from the public Maven
          profile. Only the regions between the `offerings:next` and
          `offerings:all` markers change.

          Check the rendered diff before merging: the source is a third-party
          page, and titles and slugs arrive from it.
          BODY
          )"
          fi

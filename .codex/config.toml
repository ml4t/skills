# ML4T Skills — agent sandbox permissions
# 66 standalone agent skills teaching quant ML techniques
# Needs access to book (source material) and code (examples)

sandbox_mode = "workspace-write"
approval_policy = "never"
model_reasoning_effort = "high"

[sandbox_workspace_write]
network_access = true
writable_roots = [
    "/home/stefan/ml4t/third_edition/book",
    "/home/stefan/ml4t/third_edition/code",
    "/home/stefan/ml4t/libraries",
    "/home/stefan/.cache/uv",
]
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[history]
persistence = "none"

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.context7.env]
DEFAULT_MINIMUM_TOKENS = "8000"

[mcp_servers.ml4t-refs]
command = "/home/stefan/ml4t/references/ml4t-refs-mcp.sh"
